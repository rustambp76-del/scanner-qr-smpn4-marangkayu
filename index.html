<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner QR - SMP Negeri 4 Marangkayu</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    h2 {
      color: #1e3a8a;
      margin-bottom: 5px;
    }

    .sub {
      color: #64748b;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      min-height: 300px;
      border: 2px solid #1e40af;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #dbeafe;
      border-radius: 10px;
      color: #1e3a8a;
    }

    #hasil {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #dcfce7;
      border: 1px solid #16a34a;
      border-radius: 10px;
      color: #166534;
      font-weight: bold;
      word-break: break-word;
    }
  </style>

</head>

<body>

  <div class="container">

    <h2>📷 Scanner QR</h2>

    <div class="sub">
      SMP NEGERI 4 MARANGKAYU
    </div>

    <div id="reader"></div>

    <div id="status">
      📷 Menyiapkan kamera...
    </div>

    <div id="hasil"></div>

  </div>


  <script>

    let scanner = null;
    let sudahScan = false;


    // ==========================================
    // MENAMPILKAN HASIL QR
    // ==========================================

    function tampilHasil(text) {

      const hasil = document.getElementById("hasil");

      hasil.style.display = "block";

      hasil.innerHTML =
        "✅ QR TERBACA<br><br>" +
        text;
    }


    // ==========================================
    // MEMULAI SCANNER
    // ==========================================

    function mulaiScanner() {

      const status = document.getElementById("status");

      console.log("Memulai scanner...");

      scanner = new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      };


      Html5Qrcode.getCameras()

        .then(function(cameras) {

          console.log(
            "Kamera ditemukan:",
            cameras
          );


          if (
            !cameras ||
            cameras.length === 0
          ) {

            throw new Error(
              "Kamera tidak ditemukan."
            );

          }


          const cameraId =
            cameras[0].id;


          console.log(
            "Menggunakan kamera:",
            cameraId
          );


          return scanner.start(

            cameraId,

            config,


            // ==================================
            // QR BERHASIL TERBACA
            // ==================================

            function(decodedText, decodedResult) {

              if (sudahScan) {
                return;
              }


              sudahScan = true;


              console.log(
                "QR TERBACA:",
                decodedText
              );


              // Tampilkan hasil
              tampilHasil(decodedText);


              // =================================================
              // KIRIM DATA KE APPS SCRIPT
              // =================================================

fetch(
  "https://script.google.com/macros/s/AKfycbwIIdluVMq038qKf6Is6kO_wdKmXhYRrNzRSkmfvNJ5yBLXfw-I0p83n6BVr38P5fML/exec",
  {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      id: decodedText,
      mode: new URLSearchParams(window.location.search).get("mode") || "DATANG"
    })
  }
)
.then(function() {
  console.log("Data QR berhasil dikirim ke Apps Script.");
})
.catch(function(error) {
  console.error("Gagal mengirim QR:", error);
});


              // =================================
              // HENTIKAN SCANNER
              // =================================

              scanner.stop()

                .then(function() {

                  console.log(
                    "Scanner dihentikan setelah QR terbaca."
                  );

                })

                .catch(function(error) {

                  console.error(
                    "Gagal menghentikan scanner:",
                    error
                  );

                });

            },


            // ==================================
            // QR BELUM TERBACA
            // ==================================

            function(errorMessage) {

              console.log(
                "Mencari QR:",
                errorMessage
              );

            }

          );

        })


        // ======================================
        // KAMERA BERHASIL AKTIF
        // ======================================

        .then(function() {

          console.log(
            "Kamera berhasil dijalankan."
          );


          status.innerHTML =
            "📷 Kamera aktif. " +
            "Arahkan QR Code ke kamera.";

        })


        // ======================================
        // JIKA KAMERA GAGAL
        // ======================================

        .catch(function(error) {

          console.error(
            "GAGAL MEMBUKA KAMERA:",
            error
          );


          status.innerHTML =
            "⚠️ Kamera gagal dibuka.<br><br>" +
            error;

        });

    }


    // ==========================================
    // JALANKAN SAAT HALAMAN DIBUKA
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        mulaiScanner();

      }
    );

  </script>

</body>

</html>
